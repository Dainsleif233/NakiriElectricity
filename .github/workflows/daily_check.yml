name: Daily Electricity Check

on:
  schedule:
    # 每3小时运行一次 (0:00, 3:00, 6:00, ...)
    - cron: '0 */3 * * *'
  workflow_dispatch: # 允许手动触发

jobs:
  scrape-and-commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 获取完整历史，便于分析

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Cache node modules
        uses: actions/cache@v3
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Run Scraper
        id: scrape
        env:
          TOKEN: ${{ secrets.TOKEN }}
          CAMPUS: ${{ secrets.CAMPUS }}
          BUILDING: ${{ secrets.BUILDING }}
          FLOOR: ${{ secrets.FLOOR }}
          ROOM: ${{ secrets.ROOM }}
        run: |
          echo "Starting scraper..."
          node scripts/scrape.js
          echo "scrape_status=success" >> $GITHUB_OUTPUT
        continue-on-error: false

      - name: Check for changes
        id: check_changes
        run: |
          if git ls-files --error-unmatch public/data.json &gt;/dev/null 2&gt;&amp;1; then
            # 文件已被追踪，检查是否有变化
            if git diff --quiet public/data.json; then
              echo "has_changes=false" &gt;&gt; $GITHUB_OUTPUT
              echo "No changes detected in data.json"
            else
              echo "has_changes=true" &gt;&gt; $GITHUB_OUTPUT
              echo "Changes detected in data.json"
            fi
          else
            # 文件未被追踪（新文件），视为有变化
            echo "has_changes=true" &gt;&gt; $GITHUB_OUTPUT
            echo "New file data.json detected"
          fi

      - name: Commit and Push changes
        if: steps.check_changes.outputs.has_changes == 'true'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update electricity data [skip ci]"
          file_pattern: public/data.json
          commit_user_name: github-actions[bot]
          commit_user_email: github-actions[bot]@users.noreply.github.com

      - name: Notify on failure
        if: failure()
        run: |
          echo "::error::数据采集失败！请检查环境变量配置和网络连接。"
          exit 1
