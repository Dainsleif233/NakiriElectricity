name: Daily Electricity Check

on:
  schedule:
    # 每3小时运行一次 (0:00, 3:00, 6:00, ...)
    - cron: '0 */3 * * *'
  workflow_dispatch: # 允许手动触发

jobs:
  scrape-and-commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 获取完整历史，便于分析

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Cache node modules
        uses: actions/cache@v3
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Run Scraper
        id: scrape
        env:
          TOKEN: ${{ secrets.TOKEN }}
          CAMPUS: ${{ secrets.CAMPUS }}
          BUILDING: ${{ secrets.BUILDING }}
          FLOOR: ${{ secrets.FLOOR }}
          ROOM: ${{ secrets.ROOM }}
        run: |
          echo "Starting scraper..."
          node scripts/scrape.js
          echo "scrape_status=success" >> $GITHUB_OUTPUT
        continue-on-error: false

      - name: Stage data file
        run: git add public/data.json

      - name: Commit and Push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update electricity data [skip ci]"
          file_pattern: public/data.json
          commit_user_name: github-actions[bot]
          commit_user_email: github-actions[bot]@users.noreply.github.com
          push_as_authenticated_user: false

      - name: Notify on failure
        if: failure()
        run: |
          echo "::error::数据采集失败！请检查环境变量配置和网络连接。"
          exit 1
